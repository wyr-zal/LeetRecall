name: leetrecall

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-security: &default-security
  - no-new-privileges:true

services:
  mysql:
    image: mysql:8.4
    container_name: leetrecall-mysql
    restart: "no"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - leetrecall_mysql_data:/var/lib/mysql
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    security_opt: *default-security
    logging: *default-logging

  server:
    image: leetrecall-server:${LEETRECALL_IMAGE_TAG:-latest}
    build:
      context: ../leet-recall-server
    container_name: leetrecall-server
    restart: "no"
    init: true
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      FLYWAY_BASELINE_ON_MIGRATE: ${FLYWAY_BASELINE_ON_MIGRATE:-false}
    networks:
      - application
      - database
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1:8080/api/hot100"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 256
    security_opt: *default-security
    logging: *default-logging

  web:
    image: leetrecall-web:${LEETRECALL_IMAGE_TAG:-latest}
    build:
      context: ../leet-recall-web
    container_name: leetrecall-web
    restart: "no"
    networks:
      - application
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
    security_opt: *default-security
    logging: *default-logging

  gateway:
    image: nginx:1.27-alpine
    container_name: leetrecall-gateway
    restart: "no"
    ports:
      - "0.0.0.0:${LEETRECALL_PUBLIC_PORT:-7080}:8443"
    networks:
      application:
        ipv4_address: 172.30.88.10
    volumes:
      - ./nginx/nginx.server.conf:/etc/nginx/nginx.conf:ro
      - ./security/server.crt:/etc/nginx/tls/server.crt:ro
      - ./security/server.key:/etc/nginx/tls/server.key:ro
    depends_on:
      web:
        condition: service_healthy
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
    security_opt: *default-security
    logging: *default-logging

networks:
  application:
    name: leetrecall-application
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.88.0/28
  database:
    name: leetrecall-database
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.89.0/28

volumes:
  leetrecall_mysql_data:
    name: leetrecall_mysql_data
